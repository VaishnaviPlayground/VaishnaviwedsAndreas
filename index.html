<style>
/* Layout idea: a quiet gallery of six tiles; each opens a phone-shaped stage that plays one tap-driven save the date. */
:root{
  color-scheme:light;
  --ink:#1d2a24; --paper:#f6f1e4; --gold:#b8904a; --gold-lt:#e2c88f; --sage:#8a9a7b; --maroon:#5d1a26;
  --f-serif:"Cormorant Garamond",Georgia,serif; --f-script:"Pinyon Script","Snell Roundhand",cursive;
  --f-sans:"Jost","Helvetica Neue",Arial,sans-serif; --f-fun:"Baloo 2","Trebuchet MS",sans-serif; --f-mono:"DM Mono",ui-monospace,monospace; --f-hand:"Bilbo Swash Caps","Pinyon Script",cursive;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--f-sans);-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
img{max-width:100%}

/* ---------- gallery ---------- */
#gallery{max-width:760px;margin:0 auto;padding:28px 18px 40px}
#gallery header{display:flex;flex-direction:column;gap:6px;margin-bottom:22px}
.kicker{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:#6d6a58}
#gallery h1{font-family:var(--f-serif);font-weight:500;font-size:clamp(34px,9vw,54px);line-height:1;margin:0;text-wrap:balance}
#gallery h1 i{font-family:var(--f-script);font-style:normal;color:var(--gold);font-size:.8em;padding:0 .12em}
.facts{font-size:15px;line-height:1.5;color:#3d463f;max-width:60ch;margin:6px 0 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.tile{display:flex;flex-direction:column;gap:8px;text-align:left;background:none;border:0;padding:0}
.thumb{aspect-ratio:3/4;border-radius:6px;display:grid;place-items:center;text-align:center;padding:10px;overflow:hidden;position:relative;transition:transform .25s}
.tile:hover .thumb{transform:translateY(-3px)}
.tile b{font-family:var(--f-serif);font-size:20px;font-weight:600;line-height:1.1}
.tile span{font-size:13px;color:#5b5f55;line-height:1.35}
.th-env{background:radial-gradient(circle at 50% 30%,#a9b79a,#72836a)}
.th-env::before{content:"";position:absolute;inset:32% 16% 30%;background:#93a384;clip-path:polygon(0 0,50% 55%,100% 0,100% 100%,0 100%)}
.th-env::after{content:"V&A";position:absolute;top:44%;left:50%;width:34px;height:34px;margin:-17px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ecd59d,#a9803a);font:15px/34px var(--f-script);color:#5a4110}
.th-ele{background:#111;color:#f3ecdc;font:300 44px/.85 var(--f-serif)}
.th-car{background:#ffe9b8;color:#c2185b;font:800 22px/1 var(--f-fun)}
.th-fus{background:linear-gradient(#cfe0c8 0 44%,#b8904a 44% 56%,#f3a25f 56%);font:600 12px var(--f-sans);letter-spacing:.2em;color:#fff}
.th-brd{background:#12243a;color:#f4efe2;font:500 13px/1.5 var(--f-mono)}
.th-scr{background:var(--maroon)}
.th-scr::before{content:"scratch";width:70%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:repeating-linear-gradient(115deg,#d9b871 0 6px,#c39b4e 6px 12px);font:italic 500 15px var(--f-serif);color:#5a4110}

/* ---------- player ---------- */
#player{height:100%;display:none;flex-direction:column;background:#0f1412}
body.playing #player{display:flex}
body.playing #gallery{display:none}
.bar{flex:none;height:44px;display:flex;justify-content:space-between;align-items:center;padding:0 10px}
.bar button{background:#00000080;border:1px solid #ffffff55;color:#fff;border-radius:99px;padding:5px 13px;font-size:13px}
.wrap{flex:1;min-height:0;display:flex;justify-content:center}
.stage{position:relative;height:100%;width:min(100%,480px,calc((100dvh - 44px)*.6));overflow:hidden;container-type:size;user-select:none}
.stage>*{position:absolute}
.fx{inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
.hint{left:0;right:0;text-align:center;font-size:3.4cqw;letter-spacing:.3em;text-transform:uppercase;animation:pulse 1.8s infinite;pointer-events:none;transition:opacity .4s}
@keyframes pulse{50%{opacity:.35}}
.ev{display:flex;flex-direction:column;gap:.6cqw}
.ev-k{font-size:2.9cqw;letter-spacing:.32em;text-transform:uppercase}
.ev-d{font-family:var(--f-serif);font-size:6.6cqw;font-weight:500;line-height:1.05}
.ev-p{font-size:3.5cqw;line-height:1.35}

/* ---------- 1 envelope ---------- */
.t-env{background:radial-gradient(circle at 50% 30%,#a9b79a,#6f8067)}
.t-env .top{top:14cqh;left:0;right:0;text-align:center;color:#f6f1e4;transition:opacity .5s}
.t-env .top .s{font:13cqw/1 var(--f-script)}
.t-env .top .n{font:500 3.6cqw var(--f-sans);letter-spacing:.34em;text-transform:uppercase;margin-top:2cqw}
.env{left:10cqw;top:50%;width:80cqw;height:55cqw;margin-top:-18cqw;perspective:220cqw;transition:transform 1s ease-in,opacity .8s;filter:drop-shadow(0 4cqw 5cqw #0004)}
.env>*{position:absolute}
.env-back{inset:0;background:#55664f;border-radius:1cqw}
.letter{left:5%;right:5%;top:6%;height:88%;background:#fbf7ee;border-radius:.8cqw;z-index:1;transition:transform 1s cubic-bezier(.2,.8,.2,1);display:grid;place-items:start center;padding-top:5cqw;font:9cqw var(--f-script);color:var(--gold)}
.env-front{inset:0;z-index:2;background:linear-gradient(to top,#98a889,#7f9072);clip-path:polygon(0 0,50% 56%,100% 0,100% 100%,0 100%);border-radius:1cqw}
.flap{left:0;top:0;width:100%;height:62%;background:linear-gradient(#a7b698,#93a384);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .8s,z-index 0s .4s;z-index:3}
.seal{left:50%;top:62%;width:16cqw;height:16cqw;margin:-8cqw;border-radius:50%;border:0;z-index:4;background:radial-gradient(circle at 35% 30%,#f0dca8,#b08a42 70%,#8d6a2c);box-shadow:0 .6cqw 1.6cqw #0005,inset 0 0 0 1cqw #ffffff22;font:7.5cqw/1 var(--f-script);color:#5a4110;transition:transform .4s,opacity .4s}
.t-env .hint{bottom:12cqh;color:#f6f1e4}
.t-env.open .flap{transform:rotateX(180deg);z-index:0}
.t-env.open .seal{transform:scale(.3);opacity:0}
.t-env.open .hint,.t-env.done .top{opacity:0}
.t-env.rise .letter{transform:translateY(-64%)}
.t-env.done .env{transform:translateY(90cqh);opacity:0}
.invite{inset:4.5cqw;background:#fbf7ee;color:#2c3a30;opacity:0;transform:scale(.6);transition:opacity .8s .3s,transform 1s .3s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3cqw;text-align:center;padding:6cqw;box-shadow:0 2cqw 6cqw #0004;pointer-events:none}
.invite::before{content:"";position:absolute;inset:2cqw;border:1px solid var(--gold);outline:1px solid var(--gold-lt);outline-offset:-1.2cqw;pointer-events:none}
.t-env.done .invite{opacity:1;transform:none}
.invite img{width:46cqw;height:56cqw;object-fit:cover;object-position:50% 22%;border-radius:23cqw 23cqw 0 0}
.invite .s{font:12cqw/1 var(--f-script);color:var(--gold)}
.invite .n{font:500 7cqw/1.1 var(--f-serif);letter-spacing:.08em;text-transform:uppercase}
.invite .n i{display:block;font:italic 400 4.6cqw var(--f-serif);text-transform:none;letter-spacing:0;color:var(--gold)}
.invite .ev-k{color:var(--gold)}
.note{font:italic 400 4cqw/1.3 var(--f-serif)}

/* ---------- 2 elegant film ---------- */
.t-ele{background:#0d0d0c;color:#f3ecdc}
.bars{top:2.5cqw;left:3cqw;right:3cqw;display:flex;gap:1.2cqw;z-index:20}
.bars i{flex:1;height:.6cqw;background:#ffffff40;border-radius:9px;overflow:hidden}
.bars i::after{content:"";display:block;height:100%;width:0;background:#fff}
.bars i.past::after{width:100%}
.bars i.now::after{width:100%;transition:width var(--dur) linear}
.sc{inset:0;opacity:0;transition:opacity .9s;display:flex;flex-direction:column;justify-content:flex-end;padding:9cqw 7cqw 12cqw}
.sc.on{opacity:1}
.sc img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-1}
.sc.on img{animation:kb 7s ease-out both}
@keyframes kb{from{transform:scale(1.14)}to{transform:scale(1)}}
.sc .shade{position:absolute;inset:0;background:linear-gradient(#0003 30%,#000c);z-index:-1}
.sc>*:not(img):not(.shade){opacity:0;transform:translateY(5cqw)}
.sc.on>*:not(img):not(.shade){animation:up .9s both}
.sc.on>:nth-child(4){animation-delay:.35s}.sc.on>:nth-child(5){animation-delay:.7s}.sc.on>:nth-child(6){animation-delay:1.05s}.sc.on>:nth-child(7){animation-delay:1.4s}
@keyframes up{to{opacity:1;transform:none}}
.sm{font-size:3.2cqw;letter-spacing:.36em;text-transform:uppercase}
.big{font:300 40cqw/.8 var(--f-serif);letter-spacing:-.03em}
.nm{font:17cqw/1 var(--f-script)}
.wd{font:italic 400 6cqw var(--f-serif);color:var(--gold-lt);margin:1cqw 0 1cqw 10cqw}
.sc.lt{background:#f3ecdc;color:#16130f;justify-content:center;gap:1cqw}
.sc.lt .sm{color:#8a6a2e}
.sc p{margin:3cqw 0 0;font:400 5cqw/1.3 var(--f-serif)}
.sc.end{justify-content:center;gap:7cqw;text-align:center;border:1px solid var(--gold);inset:5cqw}
.sc.end .ev-k{color:var(--gold-lt)}
.play{inset:0;z-index:30;background:#0d0d0cd9;border:0;color:#f3ecdc;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5cqw;transition:opacity .6s}
.play .mono{font:300 26cqw/1 var(--f-serif)}
.play .mono em{font:.7em var(--f-script);color:var(--gold-lt);padding:0 .1em}
.play .hint{position:static;color:#f3ecdc}
.started .play{opacity:0;pointer-events:none}

/* ---------- 3 caricature ---------- */
.t-car{background:#ffe9b8;color:#5a1630;font-family:var(--f-fun);text-align:center}
.bunt{top:0;left:0;width:100%}
.t-car .ttl{top:17cqw;left:0;right:0;font:800 13cqw/.9 var(--f-fun);color:#c2185b}
.t-car .ttl small{display:block;font:700 4.6cqw var(--f-fun);color:#0f6e68;letter-spacing:.06em;margin-bottom:1.5cqw}
.duo{left:10cqw;width:80cqw;top:43cqw;border:0;background:none;padding:0}
.duo svg{display:block;width:100%;overflow:visible}
.duo .b,.duo .g{transform-box:fill-box;transform-origin:50% 100%}
.t-car.pop .b{animation:hop .5s 3 ease-in-out}
.t-car.pop .g{animation:hop .5s .12s 3 ease-in-out}
@keyframes hop{50%{transform:translateY(-7%) rotate(-2deg)}}
.heart{opacity:0;transform-box:fill-box;transform-origin:center}
.t-car.pop .heart{animation:beat 1s .4s both}
@keyframes beat{0%{opacity:0;transform:scale(0)}60%{opacity:1;transform:scale(1.4)}100%{opacity:1;transform:scale(1)}}
.signs{left:5cqw;right:5cqw;top:114cqw;display:flex;gap:3cqw}
.sign{flex:1;background:#fff8e6;border:.7cqw solid #5a1630;border-radius:3cqw;padding:2.6cqw 2cqw;box-shadow:1cqw 1cqw 0 #5a1630;opacity:0;transform:translateY(8cqw) rotate(-3deg);transition:.6s cubic-bezier(.3,1.6,.5,1)}
.sign:nth-child(2){transform:translateY(8cqw) rotate(3deg);transition-delay:.25s}
.pop .sign{opacity:1;transform:rotate(-1.5deg)}
.pop .sign:nth-child(2){transform:rotate(1.5deg)}
.sign b{display:block;font:800 6.8cqw/1.1 var(--f-fun);color:#c2185b}
.sign i{display:block;font:700 3cqw var(--f-fun);font-style:normal;letter-spacing:.14em;color:#0f6e68;text-transform:uppercase}
.sign span{display:block;font:500 3.2cqw/1.25 var(--f-fun);margin-top:.8cqw}
.t-car .hint{top:121cqw;color:#0f6e68;font-weight:700}
.t-car .more{top:142cqw;left:4cqw;right:4cqw;font:700 3.5cqw/1.3 var(--f-fun);color:#0f6e68;opacity:0;transition:opacity .6s .8s}
.t-car.pop .more{opacity:1}
.t-car.pop .hint{opacity:0}

/* ---------- 4 indo-german ---------- */
.t-fus{display:flex;flex-direction:column;background:#17332b;color:#fff}
.t-fus>*{position:relative}
.t-fus>.fx{position:absolute}
.pn{flex:1 1 0;min-height:0;border:0;padding:0;overflow:hidden;text-align:left;transition:flex-grow .8s cubic-bezier(.3,.8,.2,1);color:#fff}
.pn svg{position:absolute;inset:0;width:100%;height:100%}
.pn .tx{position:absolute;left:7cqw;right:7cqw;display:flex;flex-direction:column;gap:1.4cqw}
.pn.de .tx{top:7cqw;color:#1f3a2c}
.pn.in .tx{bottom:7cqw;color:#fff;text-shadow:0 0 3cqw #5b1d1088}
.pn .ct{font:500 3.2cqw var(--f-sans);letter-spacing:.34em;text-transform:uppercase}
.pn .dt{font:500 11cqw/.95 var(--f-serif)}
.pn .more{max-height:0;opacity:0;overflow:hidden;transition:max-height .8s,opacity .6s;font-size:3.8cqw;line-height:1.4}
.pn.act{flex-grow:2.3}
.pn.act .more{max-height:30cqw;opacity:1}
.pn .tap{font-size:2.8cqw;letter-spacing:.3em;text-transform:uppercase;opacity:.8;animation:pulse 1.8s infinite}
.pn.act .tap{display:none}
.seam{flex:none;background:#f8f1dc;color:#3a2a10;text-align:center;padding:2.6cqw 3cqw 3cqw;border-block:1.6cqw solid var(--gold);box-shadow:inset 0 .5cqw 0 #f8f1dc,inset 0 .9cqw 0 var(--gold),inset 0 -.5cqw 0 #f8f1dc,inset 0 -.9cqw 0 var(--gold);z-index:2}
.seam .s{font:10cqw/1 var(--f-script)}
.seam .s em{font:italic 400 .5em var(--f-serif);color:var(--gold);padding:0 .3em}
.seam .k{font-size:2.7cqw;letter-spacing:.24em;text-transform:uppercase}

/* ---------- 5 boarding ---------- */
.t-brd{background:#12243a;color:#f4efe2;font-family:var(--f-mono)}
.t-brd .hd{top:7cqw;left:7cqw;right:7cqw;font-size:3cqw;letter-spacing:.2em;text-transform:uppercase;display:flex;justify-content:space-between;color:#e2c88f}
.route{top:13cqw;left:5cqw;width:90cqw}
.route path{fill:none;stroke:#e2c88f;stroke-width:1;stroke-dasharray:3 4}
.t-brd .who{top:38cqw;left:7cqw;right:7cqw;font:500 9cqw/1.05 var(--f-serif);opacity:0;transition:opacity .8s .3s}
.t-brd .who small{display:block;font:400 3cqw var(--f-mono);letter-spacing:.16em;color:#e2c88f;margin-bottom:1.5cqw;text-transform:uppercase}
.pass{left:5cqw;width:90cqw;height:38cqw;background:#f4efe2;color:#12243a;border-radius:2.4cqw;display:flex;opacity:0;transform:translateX(110cqw) rotate(6deg);transition:transform .9s cubic-bezier(.2,.9,.3,1),opacity .3s}
.pass.p1{top:66cqw}.pass.p2{top:108cqw;transition-delay:.35s}
.pass .m{flex:1;padding:3.4cqw 4cqw;display:flex;flex-direction:column;justify-content:space-between;min-width:0}
.pass .st{flex:none;width:21cqw;border-left:.5cqw dashed #12243a66;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2cqw;position:relative}
.pass .st::before,.pass .st::after{content:"";position:absolute;left:-2.2cqw;width:4cqw;height:4cqw;border-radius:50%;background:#12243a}
.pass .st::before{top:-2cqw}.pass .st::after{bottom:-2cqw}
.pass .cc{font:500 9cqw/1 var(--f-mono)}
.pass .bc{width:13cqw;height:8cqw;background:repeating-linear-gradient(90deg,#12243a 0 .5cqw,transparent .5cqw 1.1cqw,#12243a 1.1cqw 1.4cqw,transparent 1.4cqw 2.3cqw)}
.pass .l{font-size:2.3cqw;letter-spacing:.18em;color:#12243a99;text-transform:uppercase}
.pass .d{font:500 7.2cqw/1 var(--f-mono);letter-spacing:-.03em;white-space:nowrap}
.p2 .d{font-size:6cqw}
.route .pl{opacity:0;transition:opacity .3s .6s}
.t-brd.open .route .pl{opacity:1}
.pass .v{font-size:3.1cqw;line-height:1.3}
.stamp{right:19cqw;top:5cqw;position:absolute;border:.7cqw solid #b3261e;color:#b3261e;border-radius:1.4cqw;padding:.8cqw 1.8cqw;font:500 2.9cqw var(--f-mono);letter-spacing:.14em;opacity:0;transform:scale(3) rotate(-12deg);transition:.35s 1.3s ease-in}
.p2 .stamp{transition-delay:1.7s}
.cover{left:17cqw;top:50%;width:66cqw;height:92cqw;margin-top:-40cqw;background:#173b34;border:0;border-radius:1.5cqw 4cqw 4cqw 1.5cqw;color:#e2c88f;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5cqw;transform-origin:left;transition:transform 1s ease-in,opacity .5s .5s;box-shadow:0 3cqw 7cqw #0007,inset 2cqw 0 0 #0003;z-index:5}
.cover .c1{font-size:3.4cqw;letter-spacing:.4em}
.cover .c2{width:26cqw;height:26cqw;border:.5cqw solid;border-radius:50%;display:grid;place-items:center;font:11cqw var(--f-script)}

</main>

<div id="player">

<script>
const $=(s,r=document)=>r.querySelector(s);
const stage=$('#stage');
let timers=[];
const later=(f,ms)=>timers.push(setTimeout(f,ms));
const calm=matchMedia('(prefers-reduced-motion:reduce)').matches;

let lang='en';
try{lang=localStorage.getItem('std-lang')||((navigator.language||'en').toLowerCase().startsWith('de')?'de':'en')}catch(e){}
try{const q=new URLSearchParams(location.search).get('lang');if(q==='de'||q==='en')lang=q}catch(e){}
const L=(en,de)=>lang==='de'?de:en;
let EV_DE,EV_IN,MORE,NEWS,WEDS;
function words(){
  EV_DE=`<div class="ev"><div class="ev-k">${L('Germany','Deutschland')}</div><div class="ev-d">${L('Friday, 25 June 2027','Freitag, 25. Juni 2027')}</div><div class="ev-p">Heuchelberger Warte, Leingarten</div></div>`;
  EV_IN=`<div class="ev"><div class="ev-k">${L('India','Indien')}</div><div class="ev-d">${L('3 – 5 November 2027','3. – 5. November 2027')}</div><div class="ev-p">Backwater Ripples · Kumarakom, Kerala</div></div>`;
  MORE=L('Please save the dates. More details coming soon.','Bitte merkt euch die Termine vor. Weitere Details folgen bald.');
  NEWS=L('We decided to get married','Wir heiraten');WEDS=L('weds','heiratet');
  document.getElementById('lang').textContent=L('Deutsch','English');
}

function flowers(colors,n=46){
  if(calm)return;
  const c=document.createElement('canvas');c.className='fx';stage.appendChild(c);
  const r=stage.getBoundingClientRect(),d=Math.min(2,window.devicePixelRatio||1);c.width=r.width*d;c.height=r.height*d;
  const x=c.getContext('2d');x.scale(d,d);
  const P=Array.from({length:n},()=>({x:Math.random()*r.width,y:-20-Math.random()*r.height*.8,s:5+Math.random()*5,v:1.3+Math.random()*1.9,a:Math.random()*6,w:(Math.random()-.5)*.06,k:Math.random()*6,c:colors[Math.random()*colors.length|0]}));
  let t=0;(function f(){
    x.clearRect(0,0,r.width,r.height);
    for(const p of P){p.y+=p.v;p.a+=p.w;p.k+=.03;p.x+=Math.sin(p.k)*.8;
      x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;
      for(let i=0;i<5;i++){const q=i*Math.PI*2/5;x.beginPath();x.arc(Math.cos(q)*p.s*.55,Math.sin(q)*p.s*.55,p.s*.46,0,7);x.fill()}
      x.fillStyle='#f3bf3f';x.beginPath();x.arc(0,0,p.s*.32,0,7);x.fill();x.restore()}
    if(++t<420&&c.isConnected)requestAnimationFrame(f);else c.remove();
  })();
}
function petals(colors,n=80){
  if(calm)return;
  const c=document.createElement('canvas');c.className='fx';stage.appendChild(c);
  const r=stage.getBoundingClientRect();c.width=r.width;c.height=r.height;
  const x=c.getContext('2d');
  const P=Array.from({length:n},()=>({x:Math.random()*c.width,y:-Math.random()*c.height*.7,s:4+Math.random()*6,v:1.6+Math.random()*2.6,a:Math.random()*6,c:colors[Math.random()*colors.length|0]}));
  let t=0;(function f(){
    x.clearRect(0,0,c.width,c.height);
    for(const p of P){p.y+=p.v;p.a+=.05;p.x+=Math.sin(p.a);x.fillStyle=p.c;x.beginPath();x.ellipse(p.x,p.y,p.s,p.s*.55,p.a,0,7);x.fill()}
    if(++t<280&&c.isConnected)requestAnimationFrame(f);else c.remove();
  })();
}

const T={
envelope:{name:'The Envelope',desc:'Break the wax seal, the flap opens and your card rises out.',th:'th-env',thTxt:'',bg:'#6f8067',
 build(){
  stage.className='stage t-env';
  stage.innerHTML=`<div class="top"><div class="s">${L('For you','Für euch')}</div><div class="n">${L('from','von')} Vaishnavi &amp; Andreas</div></div>
  <div class="env"><div class="env-back"></div><div class="letter">Save the Date</div><div class="env-front"></div><div class="flap"></div><button class="seal" type="button" aria-label="Open the envelope">V&amp;A</button></div>
  <div class="hint" style="position:absolute">${L('Tap the seal','Siegel antippen')}</div>
  <div class="invite"><img src="park.jpg" alt="Vaishnavi and Andreas in a park"><div class="s">Save the Date</div>
  <div class="n">Vaishnavi <i>${WEDS}</i> Andreas</div>${EV_DE}${EV_IN}<div class="note">${NEWS}.<br>${MORE}</div></div>`;
  $('.seal',stage).onclick=()=>{
   stage.classList.add('open');

   later(()=>{stage.classList.add('done');petals(['#e2c88f','#fbf7ee','#d9a7a0'],50)},1700);
  };
 }},
elegant:{name:'Noir Film',desc:'A short black and ivory film with your photos and big numerals.',th:'th-ele',thTxt:'25<br>06<br>27',bg:'#0d0d0c',
 build(){
  stage.className='stage t-ele';
  stage.innerHTML=`<div class="bars"><i></i><i></i><i></i><i></i></div>
  <section class="sc"><img src="blue.jpg" alt="Vaishnavi and Andreas" style="object-position:50% 20%"><div class="shade"></div><div class="sm">${NEWS}</div><div class="nm">Vaishnavi</div><div class="wd">${WEDS}</div><div class="nm">Andreas</div></section>
  <section class="sc lt"><i></i><i></i><div class="sm">${L('Germany · save the date','Deutschland · Save the Date')}</div><div class="big">25</div><div class="big">06</div><div class="big">27</div><p>${L('Friday','Freitag')}<br>Heuchelberger Warte, Leingarten</p></section>
  <section class="sc"><img src="dance.jpg" alt="The couple dancing in a forest"><div class="shade"></div><div class="sm">${L('India · save the dates','Indien · Save the Dates')}</div><div class="big" style="font-size:30cqw">03–05</div><div class="big" style="font-size:30cqw">11 · 27</div><p>Backwater Ripples<br>Kumarakom, Kerala</p></section>
  <section class="sc end"><i></i><i></i><div class="nm" style="font-size:12cqw">Vaishnavi &amp; Andreas</div>${EV_DE}${EV_IN}<div class="note">${MORE}</div></section>
  <button class="play" type="button"><span class="mono">V<em>&amp;</em>A</span><span class="hint">${L('Tap to play','Antippen')}</span></button>`;
  const sc=[...stage.querySelectorAll('.sc')],bars=[...stage.querySelectorAll('.bars i')],D=[5200,5200,5200,0];
  let i=-1,tm;
  const go=n=>{
   clearTimeout(tm);i=Math.min(n,sc.length-1);
   sc.forEach((s,k)=>s.classList.toggle('on',k===i));
   bars.forEach((b,k)=>{b.className=k<i?'past':'';b.style.setProperty('--dur',D[i]+'ms')});

   if(D[i]){tm=setTimeout(()=>go(i+1),D[i]);timers.push(tm)}
  };
  $('.play',stage).onclick=()=>{stage.classList.add('started');go(0)};
  sc.forEach(s=>s.onclick=()=>{if(i<sc.length-1)go(i+1)});
 }},

 }},
calendar:{name:'The Calendar',desc:'Elegant. Tap the calendar: the 25th gets circled, then it flips to November.',th:'th-cal',thTxt:'<span>25</span>',bg:'#f6f1e4',
 build(){
  stage.className='stage t-cal';
  stage.innerHTML=`<div class="s">Save the Date</div><div class="n">Vaishnavi<i>${WEDS}</i>Andreas</div>
  <button class="calc" type="button" aria-label="${L('Mark the dates','Termine markieren')}"><div class="mon"></div><div class="cg"></div><div class="info"></div></button>
  <div class="hint" style="position:absolute">${L('Tap the calendar','Kalender antippen')}</div><div class="note">${NEWS}. ${MORE}</div>`;
  const card=$('.calc',stage),Mo=[{m:5,name:L('June 2027','Juni 2027'),mark:[25],info:`<b>${L('Germany','Deutschland')}</b>${L('Friday, 25 June','Freitag, 25. Juni')}<br>Heuchelberger Warte, Leingarten`},
   {m:10,name:'November 2027',mark:[3,4,5],info:`<b>${L('India','Indien')}</b>${L('3 – 5 November','3. – 5. November')}<br>Backwater Ripples, Kumarakom, Kerala`}];
  const draw=(k,on)=>{const o=Mo[k],first=(new Date(2027,o.m,1).getDay()+6)%7,days=new Date(2027,o.m+1,0).getDate();
   let h=[...L('MTWTFSS','MDMDFSS')].map(c=>`<span class="hd">${c}</span>`).join('')+'<span></span>'.repeat(first);
   for(let d=1;d<=days;d++){const i=o.mark.indexOf(d);h+=`<span${on&&i>=0?` class="mk" style="animation-delay:${i*.2}s"`:''}>${d}</span>`}
   $('.mon',card).textContent=o.name;$('.cg',card).innerHTML=h;$('.info',card).innerHTML=on?o.info:L('When is it?','Wann ist es so weit?')};
  let step=0;draw(0,false);
  card.onclick=()=>{step++;
   if(step===1){draw(0,true);petals(['#b8904a','#5d1a26','#e2c88f'],40);return}
   const k=(step-1)%2;card.classList.add('flip');later(()=>{draw(k,true);card.classList.remove('flip');if(step===2)petals(['#b8904a','#5d1a26','#e2c88f'],40)},350)};
 }},

const JR_HEAD=()=>`<div class="s">Save the Date</div><div class="n">Vaishnavi <i>${WEDS}</i> Andreas</div>`;
const JR_BADGE=()=>`<div class="bd de"><i>${L('Germany','Deutschland')}</i><b>25.06.2027</b><span>Heuchelberger Warte, Leingarten</span></div><div class="bd in"><i>${L('India','Indien')}</i><b>3–5.11.2027</b><span>Backwater Ripples, Kumarakom, Kerala</span></div>`;
const JR_FOOT=()=>`<div class="both">25.06.2027 Leingarten · 3–5.11.2027 Kumarakom</div><div class="note">${NEWS}. ${MORE}</div>`;
const jrToggle=(ms,moving)=>{let first=true,busy=false;$('.scn',stage).onclick=()=>{if(busy)return;busy=true;stage.classList.toggle('ind');if(moving)stage.classList.add('mv');$('.hint',stage).style.opacity=0;
  later(()=>{busy=false;stage.classList.remove('mv');if(first){first=false;petals(['#f28c1e','#f6b21b','#c2185b','#fff'],80)}},calm?100:ms)}};
Object.assign(T,{
'journey-panorama':{name:'Tuk-Tuk Panorama',desc:'You two ride a big open tuk-tuk while the vineyards glide smoothly into the backwaters.',th:'th-jr th-j1',thTxt:'Tuk-Tuk<br>Panorama',bg:'#fdf6e8',
 build(){stage.className='stage t-jr';
  stage.innerHTML=`${JR_HEAD()}${JR_BADGE()}<button class="scn" type="button" aria-label="${L('Start the trip','Losfahren')}">${SVG_STRIP}<div class="cart">${CART()}</div></button>
  <div class="hint" style="position:absolute">${L('Tap to drive','Antippen und losfahren')}</div>${JR_FOOT()}`;jrToggle(6500,true)}},
'journey-fade':{name:'Sunrise to Sunset',desc:'White dress and black suit at the Heuchelberg. Tap, and it melts into saree and veshti in Kerala.',th:'th-jr th-j2',thTxt:'Sunrise<br>to Sunset',bg:'#fbf7ef',
 build(){stage.className='stage t-fd';
  stage.innerHTML=`<div class="fd-std">Save the Date</div>
  <div class="fd-nm" data-w="48"><span>Vaishnavi</span><em>&amp;</em><span>Andreas</span></div>
  <div class="fd-dt"><div><b>25.06.2027</b><u>Heuchelberger Warte</u><span>Leingarten ${L('(approx. 4 pm)','(ca. 16 Uhr)')}</span></div><div><b>${L('03–05.11.2027','03.–05.11.2027')}</b><u>Backwater Ripples</u><span>${L('Kerala, India','Kerala, Indien')}</span></div></div>
  <button class="fd-scn" type="button" aria-label="${L('Switch between the two weddings','Zwischen den beiden Hochzeiten wechseln')}">${FD_DE}${FD_IN}<div class="gnd"></div><div class="fd-cp">${FD_DUO}</div><span class="fd-go"></span></button>
  <p class="fd-p">${L('We’re getting married twice, and we’d love to celebrate both weddings with you.','Wir heiraten gleich zweimal und möchten beide Feste gemeinsam mit euch feiern.')}</p>
  <div class="fd-rs" data-w="58">${L('Please save these dates','Bitte reserviert diese Tage')}</div>
  <div class="fd-mo">${L('More info to follow','Weitere Infos folgen')}</div>`;
  const go=$('.fd-go',stage);let first=true;
  const lab=()=>{go.textContent=stage.classList.contains('ind')?L('← Back to Germany','← Zurück nach Deutschland'):L('Tap: on to India →','Tippen: weiter nach Indien →')};
  const fit=()=>stage.querySelectorAll('[data-w]').forEach(el=>{el.style.fontSize='';const sw=stage.clientWidth,kids=[...el.querySelectorAll('span')],w=Math.max(...(kids.length?kids:[el]).map(k=>k.getBoundingClientRect().width)),fs=parseFloat(getComputedStyle(el).fontSize);if(w>0&&sw>0)el.style.fontSize=(fs*(+el.dataset.w*sw/100)/w/sw*100).toFixed(2)+'cqw'});
  lab();fit();if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{if(stage.classList.contains('t-fd'))fit()});
  $('.fd-scn',stage).onclick=()=>{stage.classList.toggle('ind');go.style.animation='none';lab();if(first){first=false;later(()=>flowers(['#f4a7b5','#ffffff','#f6c9a8','#f28c1e','#e8718d']),calm?100:1500)}};
 }},
'journey-slider':{name:'Slide Between Homes',desc:'Drag the line left and right: Germany on one side, India on the other, you two in the middle.',th:'th-jr th-j3',thTxt:'Slide',bg:'#fdf6e8',
 build(){stage.className='stage t-jr pop';
  stage.innerHTML=`${JR_HEAD()}<div class="signs">${SIGN_DE()}${SIGN_IN()}</div><div class="scn" aria-label="${L('Drag to compare','Ziehen zum Vergleichen')}">${SVG_DE.replace('<svg','<svg class="bg"')}${SVG_IN.replace('<svg','<svg class="bg in3"')}<div class="hdl"></div><div class="gnd"></div><div class="cp">${SVG_DUO}</div></div>
  <div class="hint" style="position:absolute">${L('Drag the line','Linie ziehen')}</div>${JR_FOOT()}`;
  const sc=$('.scn',stage);sc.style.touchAction='none';let down=false,done=false;
  const mv=e=>{const r=sc.getBoundingClientRect();sc.style.setProperty('--x',Math.max(4,Math.min(96,(e.clientX-r.left)/r.width*100))+'%');$('.hint',stage).style.opacity=0;
   if(!done){done=true;petals(['#f28c1e','#f6b21b','#c2185b','#fff'],60)}};
  sc.onpointerdown=e=>{down=true;try{sc.setPointerCapture(e.pointerId)}catch(_){}mv(e)};sc.onpointermove=e=>{if(down)mv(e)};sc.onpointerup=sc.onpointercancel=()=>{down=false};
 }},
'journey-planet':{name:'Around Our World',desc:'A little planet turns under your tuk-tuk: the Heuchelberg side rolls away and Kerala rolls in.',th:'th-jr th-j4',thTxt:'Around<br>Our World',bg:'#fdf6e8',
 build(){stage.className='stage t-jr';
  stage.innerHTML=`${JR_HEAD()}${JR_BADGE()}<button class="scn sky" type="button" aria-label="${L('Turn the world','Welt drehen')}">${PLANET}<div class="cart">${CART()}</div></button>
  <div class="hint" style="position:absolute">${L('Tap to turn the world','Antippen und Welt drehen')}</div>${JR_FOOT()}`;jrToggle(3800,true)}}
});

/* gallery */
const grid=$('#grid');
const ORDER=Object.keys(T).filter(k=>k.startsWith('journey-')).concat(Object.keys(T).filter(k=>!k.startsWith('journey-')));
for(const id of ORDER){const t=T[id];
  const b=document.createElement('button');b.className='tile';b.type='button';
  b.innerHTML=`<div class="thumb ${t.th}">${t.thTxt}</div><b>${t.name}</b><span>${t.desc}</span>`;
  b.onclick=()=>{location.hash=id};grid.appendChild(b);
}
function route(){
  document.documentElement.lang=lang;
  timers.forEach(clearTimeout);timers=[];
  words();
  const id='journey-fade',t=T[id];
  document.body.classList.toggle('playing',!!t);
  stage.innerHTML='';
  if(t){$('#player').style.background=t.bg;requestAnimationFrame(()=>t.build())}
}
$('#back').onclick=()=>{location.hash='all-designs'};
$('#replay').onclick=route;
$('#lang').onclick=()=>{lang=lang==='de'?'en':'de';try{localStorage.setItem('std-lang',lang)}catch(e){}route()};
addEventListener('hashchange',route);
history.replaceState(null,'',location.pathname+location.search+'#journey-fade');
route();
</script>
